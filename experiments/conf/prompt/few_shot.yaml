      ex_tie_argA: 'First off, you question whether " the only factor effecting unemployment
        is the finances of those employing the workforce" is true. Economics 101 would
        support that it is true in most if not all cases. Your statement "raising the
        federal minimum wage may work to incentivize people who have previously relied
        on welfare to seek employment. " seems more an indictment of welfare than a
        cogent argument for raising minimum wage. Here is another opinion (with a citation)
        From : "Beginning in 2008, the United States economy entered a recession. Yet,
        at a time when many companies found it necessary to cut labor costs, the minimum
        wage increased. Faced with the limited choices of ( remaining in business) or
        laying off workers, the minimum wage workers were the ones to suffer by being
        laid off, according to Forbes.com. In 2004, three states that had higher minimum
        wage laws than were required---Alaska, Washington and Oregon---were among the
        five states with the highest unemployment, according to an Economic Policy Institute
        article by Jeff Chapman. " To clarify, I would support keeping the minimum where
        it is, but making it beneficial for companies to give "merit'' or "service"
        increases. In other words, keep minimum wage as a STARTING wage, but give increases
        based on performance. This would be much better than a blanket raising of the
        wage for workers, some of whom are more of a liability than an asset. On a personal
        note, I once worked for a Fortune 500 corporation that paid minimum wage plus
        commission on sales. Those that sold did well. Those that did not produce usually
        left for another job. Raising the minimum would not have changed anything at
        all.'
      ex_tie_argB: I accept. Noting the comments others left, I will take this debate
        on in what I believe to be the spirit you intended, and will not resort to cheap
        tricks like only considering a one-penny increase. Proceed, honored opponent.
