    dialectic:
      ex_A_argA: How is that a burden on tax payers? The allocation of tax should be
        properly accounted for to help the working class/students. Moreover, instead
        of spending a lot of money on the armed forces for example (America), there
        should be government operated hospitals/clinics that cater for medical emergencies/check-ups
        or so what have you, for free. This idea is not bizarre, tons of countries in
        Europe and other continents (where there really is the bloody "American dream")
        have free health care. Don't look at Greece or Italy (cause they're bankrupt),
        but look at the UK, Germany, Sweden, Iceland. Norway, Spain, France, Malta etc.
        where the health care is free. On the other hand, citizens that have free health
        care are usually more content with their lives and in turn they have more money
        to sustain themselves instead of having to pay for medical insurance. Thus is
        it possible to have free health care without increasing taxes, because by using
        the funds properly, the government would be able to take a more direct helpful
        role on people's lives instead of institutionalizing everything.
