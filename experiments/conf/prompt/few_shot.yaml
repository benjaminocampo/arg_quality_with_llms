    logic:
      ex_A_argA: The opposition's conclusions can be attacked in three ways. First,
        countries that are less economically developed than wealthy North American and
        European states are not likely to support rules or laws similar to the 3Rs doctrine
        or Directive 2010/63/EU. In these countries, low animal welfare standards often
        mean that animal research is cheaper relative to the cost of non-animal methods
        such as computer models or cell cultures. Second, across the world, researchers
        tend to specialise in certain fields. Animal researchers tend to involve animal
        work in most of their projects, meaning that they may be less aware of alternative
        methods that could be used. Essentially, an individual who has spent their entire
        career as an animal researcher is likely to see all scientific problems in their
        field of research as solvable through animal experiments. Finally, toxicology
        work on new drugs (and sometimes other products) still legally requires animal
        testing in most countries of the world. The length of time it took to introduce
        the EU ban on animal testing for cosmetic testing shows the difficulties faced
        by governments in adopting new methods of regulating animal research.
