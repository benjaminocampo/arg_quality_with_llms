type: few_shot
system: |
  You are given two arguments: Argument A and Argument B.
  Decide which one is {dim_adverb} stronger:
  Reply with only one of the following options: A, B, or Tie.
  
  Examples:
  Argument A: {ex_A_argA}
  Argument B: {ex_A_argB}
  A

  Argument A: {ex_B_argA}
  Argument B: {ex_B_argB}
  B

  Argument A: {ex_tie_argA}
  Argument B: {ex_tie_argB}
  tie
user: "Argument A: {a}\nArgument B: {b}"
output_labels: ["A", "B", "Tie"]
examples:
  tid_1:
    dialectic:
      ex_A_argA: 'Thank you for your speech. I look forward to a good and informative
        debate. To begin, I do not think my opponent understands minimum wage based
        on his statement: "minimum wage pays 10.10 to pizza guy. If McDonald''s doesn''t
        raise it price to the manager of McDonald''s which is about 10.00 in Illinois
        to 13-16 dollars then no one will take the job. So in reality everyone gets
        a raise." To raise the minimum wage you legislate a law where EVERY COMPANY
        must raise the wages of all of its workers to that wage or above. If you change
        the minimum wage to $10.10 no company can pay a worker less than $10.10. On
        a completely unrelated note, the American dream is meant to be for Americans.
        People immigrating from mexico to america do not deserve anything, and especially
        should not get to decide on our wages. I will not actually explain what happens
        when you raise the minimum wage. If you raise the lowest amount a person can
        get paid, the company must pay them more. To compensate for this, the company
        may raise the prices of its products. Due to this, the only product of a raise
        of minimum wage is inflation, it does not actually benefit anyone. But raising
        the minimum wage actually harms people. Companies cannot afford to pay the workers
        more, will replace them with machines. Then the workers are unemployed. Once
        they are unemployed they claim more unemployment benefits. Coupled with the
        fact that the government cannot actually replace their workers so pays them
        more, the government will lose money. The costs of raising the minimum wage
        are high and it provides no benefits. This is why the minimum wage must not
        be raised.'
      ex_A_argB: Acceptance! ^_^ The minimum wage should be raised to benefit families,
        immigrants, and middle class people all across america.
