        \ then social networks would be unable to function. Social networks encourage\
        \ people to express what they are doing rather than reading what others have\
        \ to say. If people want to feel integrated into their communities, they should\
        \ get out and about and do something active for it. Complaining about things\
        \ online will not result in direct action solving the problem. Although it is\
        \ true that people all over the world are now theoretically able to communicate\
        \ with one another more easily, that is not how the Internet is actually used\
        \ most of the time. Many Internet users either read digitized versions of traditional\
        \ information sources, and when they are on social networking sites, they engage\
        \ most often with real-life friends, with whom they could easily spend face-to-face\
