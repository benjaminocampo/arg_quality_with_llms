        including children who are old enough to read a candidate's name. Because the
        principle of a democracy is one-person-one-vote, if children are to be excluded
        the burden of proof rests on my opponent. Excluding children undermines democracy,
        because children are a social class like any other, with their own needs and
        interests. If they are not represented they will be exploited, and they are
        exploited immensely. Issues like education, adoption, foster care, after-school
        programs, curfew, and many more affect children more than any other group, and
        yet they are the only group that has no say. It is easy for adults in these
        fields to say they have children's best interests at heart, but they are never
        required to prove this is so, and they could just as easily be mistaken about
        what children really want and need. I will anticipate one counterargument, that
        children shouldn't be allowed to vote because they are ignorant. I would say
        that a large majority of voting adults are ignorant, and we let them vote anyway,
        while a good number of children are well informed and yet not allowed to vote.
        Furthermore, children are usually better informed on child-related topics such
        as education, etc. than the average adult. If we are to justify excluding children,
