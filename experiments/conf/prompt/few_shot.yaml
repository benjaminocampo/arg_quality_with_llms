    rhetoric:
      ex_A_argA: The real problem for allowing all students to vote in local school
        board elections is that they don't understand the issues, and that they would
        vote against things that are in their best interest. For example, a kindergartner
        cannot understand what electing a certain school board member would mean for
        them, and in the idea of their best interests we shouldn't allow people to be
        voted by a broad electorate of people that cannot even read. The democratic
        process is something that should be respected, and allowing someone the age
        of 4 to vote on their school board members without understanding what changes
        would occur goes against any idea of self-interest. Students would also vote
        for school board members that do not act in the best interest of the schools.
        For example, they would vote for a school board member that advocates for no
        dress code whatsoever, even though this would have some very bad consequences.
        They may vote for someone that promises to give all students A's no matter what
        - that is not in the best interest of their education. Whether or not the things
        affect them, that doesn't mean they should have a say in the democratic process.
        There aren't any reasons for WHY we should allow the students to vote except
        that it would be democratic... so what? That'd bring insane challenges to the
        school board as a whole.
