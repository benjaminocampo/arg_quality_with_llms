    logic:
      ex_A_argA: 'Advocates of increased government involvement in health care frequently
        cite the profits of private health care providers as a major part of the costs
        of health care. An example of the criticism is that of Representative Anthony
        Weiner (D-NY), speaking on the Rachel Maddow show, who said, speaking of proposed
        legislation that would heavily tax the health insurance industry: "Well, the
        one behavioral change we are clearly not going to see is the insurance companies
        aren''t going to suddenly start saying, ''You know what, we are going to stop
        making 30 percent profits and cut it down to 10 percent or 5 percent because
        of this bill.'' " So are the insurance company profits really 30%, as claimed?
