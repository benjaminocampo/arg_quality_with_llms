      ex_A_argA: 'People who have been sent to prison are rightly condemned to ''civic
        death''; they are shut away not only to protect society, but also to symbolize
        society''s disgust at their acts. Theoretically, felons are deemed to have ''broken
        the social contract'' and felt to not have the ''moral competence to participate
        in governing a society''1. Although prisoners are no longer executed in many
        jurisdictions, the idea of "civic death" is that they lose the rights of citizens
        without dying in a literal sense. Those who offend against the common good of
        society should have no right to contribute to the governance of society. They
        can only be readmitted to society, both physically and in terms of their rights,
        when they have made amends to society by serving their sentence. 1 Johnson-Parris,
        A. S. (2003). Felon Disenfrachisement: The Unconscionable Social Contract Breached.
