        more advisable to have a balanced diet with proper inclusion of meat and other
        non-vegetarian items. Non-vegetarian food items are also having certain nutrient
        value and they are also highly required for our health. Thus having a diet which
        fully avoids non-vegetarian items can never be a complete diet for any human
        being. One should always know the difference between a vegetarian diet and a
        non-vegetarian diet. A balanced diet should always have a proper combination
        of both of these. Thus being vegetarian is not so good for health.
