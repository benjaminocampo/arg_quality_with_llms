    dialectic:
      ex_A_argA: 'Rebuttal #1 It''s basic economics. In a free market production is
        determined by supply and demand. If less people eat meat businessmen will respond
        by making less than they otherwise would, and so raising less livestock over
        time. Saying vegetarianism is wasteful because they aren''t using the meat is
        like saying abstention from any given product is wasteful because the individual
        is choosing not to buy the product and put it to use. If that really was wasteful
        we''d be in trouble, because as much as we consume each individual still does
        not buy even a majority of available products in the economy. Rebuttal #2 If
        one more person is vegetarian it tilts the market towards it being more productive
        to use that grain and other resources for other purposes such as bread for humans,
        so there is no waste. See my point on #1 about the market. Rebuttal #3 Iron
        and Protein can easily be supplemented in health food stores. Some would prefer
        not to do this, but that''s a personal decision. Rebuttal #4 There is no waste
        being made by vegetarianism. Whether or not vegetarianism is big enough to make
        any real changes to the economy it is not wasting anything, because the market
        takes care of changes in people''s preferences. Furthermore, not every vegetarian
        cares about the slaughter houses. Some vegetarians are apolitical and simply
        do not like eating meat. Saying vegetarianism is a bad excuse to not eat meat
        is like saying disliking onions is a bad excuse to not eat onions. A person''s
        personal preferences regarding food are never a "bad excuse" to not eat it,
        because our personal tastes are subjective.'
      ex_A_argB: Being vegetarian helps the environment
      ex_B_argA: Nowadays it is becoming a trend that people are becoming vegetarians
