    logic:
      ex_A_argA: The fact that juries are prone to several biases is not a flaw inherent
        or unique to capital punishment. If there are racial or prejudicial issues in
        sentencing, these are likely to present themselves just as often in cases where
        the punishment is life in prison. It is equally problematic for people to die
        or spend decades in jails for crimes they did not commit. These errors suggest
        that the judicial process may need some reform, not that the death penalty should
        be abolished. Implementation errors that result in discrimination can and should
        be corrected. Moreover, there is little evidence that these biases are even
        present in most death penalty cases1. A study funded by the National Institute
        of Justice in the US found that differences in sentencing for white and non-white
        victims disappeared when the heinousness of the crimes were factored into the
        study1. Thus, factors relating to the crime, not the race, of the accused accounted
        for some of the purported racial disparities that were found. Finally, jurors
        must be "death- qualified" in such cases, meaning that they are comfortable
        sentencing someone to death should the fact indicate their guilt2. Thus, it
        is unlikely that many jurors will abstain from a guilty verdict because they
        are uncomfortable with the death penalty. 1 Muhlhausen, David. "The Death Penalty
        Deters Crime and Saves Lives," August 28,2007. Accessed June 5, 2011. 2 Haney,
        Craig. "Juries and the Death Penalty." Crime and Delinquency. Vol 26 no 4. October
        1980.
