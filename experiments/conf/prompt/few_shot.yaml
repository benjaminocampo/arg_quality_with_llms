    logic:
      ex_A_argA: 'Switzerland has no minimum wage, yet their average earnings are 6,200
        CHF a month {1}, about 6,300$ month in USD. The Swiss are earning more than
        we are, with no minimum wage, this is because the Swiss have something called
        a "free market" and "labour unions," so they don''t need a minimum wage, infact
        they do better without it and are more productive. Think about it, if you are
        guarenteed 10$ a hour for your labour, you would be inclined for personal profit,
        to put in labour worth less than 10$ a hour. Whereas if you are payed according
        to the quality of your work, you become more productive to earn more money.
        Also, the tenth ammendment saysa: "The powers not delegated to the Federal Goveronment,
        nor prohibbited to the states, shall be granted to the states respectvely, or
        to the people." The constitution never grants the federal goveronment the power
        to establish a minimum wage, so this power should be given to the states through
        state minium wages, or to the people through labour unions. {1}.'
      ex_A_argB: Allright. Rising the minimum wage to, say, 10 dollars, will obviously
        rise the price of the product. However, as this higher minimum wage is universal,
        it will also increase the demand of products as more wealth is allocated to
        those working on minimum wage. According to U.S. Bureau of Labor Statistics,
        in 2014 77.6 million workers (58% of workforce) were paid with hourly rates,
        of which a total of 3 million were paid the minimum wage of 7,25$ -or less.
        They make up for a total of 3,9 % of all hourly paid employees. Rising the minimum
        wage will rise the overall demand of products quite significantly. In the long
        run this will lead to inflation, but nevertheless it allocates more wealth to
        those who are "poor". In this sense it also lessens the gap between social classes.
        As overall product demand rises, the supply must increase as well. Companies
        must hire more employees and invest money in developement. All this serves to
        grow the economy.
      ex_B_argA: 'Resolution: The Federal Minimum Wage Should be Increased Rules 1.
