    logic:
      ex_A_argA: While granting exceptions for those not living in industrialised countries,
        and those struck by a sudden thirst while out for a walk, I think buying bottled
        water in general is certainly stupid. Successive studies have shown that it
        is no better than tap water. In many cases, it literally is tap water. I suppose
        it's a great triumph of marketing to get people to pay a premium price for something
        they can have for almost free out of the tap. Ridiculous slogans and marketing
        strategies are applied to this very ordinary water. It is called "iceberg water"
        or water from the Antarctic or other various supposedly extremely pure places.
        In reality, of course, it is straight out of the tap most of the time. In some
        ways, this is very comical. But it becomes less so when you think that people
        elsewhere in the world would love to have purified water on tap as we do in
        the West; and that significant resources, including energy resources which contribute
        to global warming, are expended in the whole process of marketing and bottling
        up what's already readily available. I'm tempted to call for a ban on bottled
        water even, but my libertarian impulses restrain me.
