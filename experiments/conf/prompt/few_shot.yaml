      ex_A_argA: "There are significant health benefits to 'going veggie'; a vegetarian\
        \ diet contains high quantities of fibre, vitamins, and minerals, and is low\
        \ in fat. (A vegan diet is even better since eggs and dairy products are high\
        \ in cholesterol.) The risk of contracting many forms of cancer is increased\
        \ by eating meat: in 1996 the American Cancer Society recommended that red meat\
        \ should be excluded from the diet entirely. Eating meat also increases the\
        \ risk of heart disease - vegetables contain no cholesterol, which can build\
        \ up to cause blocked arteries in meat-eaters. An American study found out that:\
        \ \u201Cthat men in the highest quintile of red-meat consumption \u2014 those\
        \ who ate about 5 oz. of red meat a day, roughly the equivalent of a small steak\
        \ had a 31% higher risk of death over a 10-year period than men in the lowest-consumption\
        \ quintile, who ate less than 1 oz. of red meat per day, or approximately three\
        \ slices of corned beef.\u201D[1] A vegetarian diet reduces the risk for chronic\
        \ degenerative diseases such as obesity, high blood pressure, diabetes and types\
        \ of cancer including colon, breast, stomach, and lung cancer because of it's\
        \ low fat/cholesterol content. There are plenty of vegetarian sources of protein,\
        \ such as beans and bean curd; and spinach is one of the best sources of iron.\
        \ [1] Tiffany Sharples, \u2018The Growing Case Against Red Meat\u2019, Time,\
        \ 23rd March 2009 \_"
