        gives us the rights to bear arms to protect ourselves from an oppressive government
        and those who seek to do us harm. Here is Ky policy on open carry. This statement
        statement is about what is justified to use deadly force by the Louisville Metro
        Police. This is basically outlining when someone would need to use their weapon.
        Also we will talk about what carrying guns in places could have prevented in
        our nation. 9.1.2 DEFINITIONS (CONTINUED) Deadly force: Force, which the officer
        knows to create a substantial risk of causing death or serious physical injury.
        Head, neck, throat or clavicle injuries caused by an impact weapon of any sort
        can lead to death or serious physical injury. Reasonable belief: When facts
        or circumstances the officer knows, or should know, are such to cause an ordinary
        and prudent officer to act or think in a similar way under similar circumstances.
        Active aggression: A threat or overt act of an assault (through physical or
        verbal means), coupled with the present ability to carry out the threat or assault,
        which reasonably indicates that an assault or injury to any person is imminent.
        Serious physical injury: A bodily injury that: =623; Creates a substantial risk
