    logic:
      ex_A_argA: "A one-state solution is the most just because a two-state solution\
        \ would inherently result in a worse situation for the Palestinians than the\
        \ Israelis, whereas a one-state solution would guarantee equal rights for all.\
        \ The July 2007 Madrid meeting in favour of a one-state solution put firth that:\
        \ \u201CA two-state solution is predicated on the unjust premise that peace\
        \ can be achieved by granting limited national rights to Palestinians living\
        \ in the areas occupied in 1967, while denying the rights of Palestinians inside\
        \ the 1948 borders and in the Diaspora.\u201D Thus, the two-state solution condemns\
        \ Palestinian citizens of Israel to permanent second-class status within their\
        \ homeland, in a racist state that denies their rights by enacting laws that\
        \ privilege Jews constitutionally, legally, politically, socially and culturally.\
        \ Moreover, the two-state solution denies Palestinian refugees their internationally\
        \ recognized right of return.\u201D(14) A two-state solution, particularly one\
        \ that enables a Jewish state, would also most likely alienate the Palestinian\
        \ population remaining within Israel. At best, they would be second class citizens.\
        \ At worst, they would be pushed out, directly or indirectly.(13) A two-state\
        \ solution, and the establishment of a Jewish state, would also kill the idea\
        \ of the return of Palestinian refugees that were expelled from Israel during\
        \ various wars and conflicts. The Palestinian state created would also- if past\
        \ experience is any judge- be highly divided (between factions such as Hamas\
        \ and Fatah) and dysfunctional. This situation would have a material impact\
        \ on the quality of life of citizens of the new Palestinian.(15)(16) Therefore,\
        \ a one-state solution is more just than a two-state solution."
