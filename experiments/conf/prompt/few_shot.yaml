      ex_B_argB: 'The full text of the resolution is "Although Israel''s position in
        the West Bank is mutually undesirable for Israel and Palestinians, Israel has
        no choice in the matter, because there are no reasonable alternatives." Cons
        job will be to suggest an alternative solution that does not increase the risk
        of harm to Israel, Israeli citizens, or the Jewish People. This debates definition
        of unreasonable includes, but is not limited to, anything that results in that.
        My opening points assume three options for Israel: 1) Assimilate the West Bank.
        This would mean annexation, and full Israeli citizenship for all occupants.
        It seems highly unlikely that the Palestinians would agree to this, and the
        average Palestinian would probably reject citizenship. Even if this were not
        so, it would be highly unsafe to assimilate an openly aggressive population
        into the country. Even if this were not so, Israel would likely risk losing
        its Jewish majority, and be subject to an the whims of a historically unfriendly
        regional Arab majority. 2) Two state solution. This proposes an Palestinian
        state in the West Bank. The trouble with this is that Israel could not safely
        defend itself from its 1967 borders, and no one who could make a lasting commitment
        to Israeli security from a potential state will make one. Israel could withdraw
        to newly drawn, defensible borders, but such a move would mean annexing certain
        parts of the West Bank, an illegal move that would likely provoke war with neighboring
        Arab states without impossible-to-get Palestinian approval. 3) Population shifts.
        This remains illegal and immoral. Most other suggestions are subject to some
        of the above objections; Con will have find one that isn''t refuted by them,
        not just unlisted. I look forward to your response.'
