    dialectic:
      ex_A_argA: 'When corporal punishment is considered acceptable in school, it has
        a tendency to become an accepted practice in the home. Parents seeking to discipline
        their children may resort to violence, an outcome made more likely if those
        parents were educated in a school system that condoned physical punishment for
        misbehaviour1. For example, in Sweden, since it banned corporal punishment in
        schools in 1979, the percentage of parents supporting corporal punishment in
        the home fell from over 50% to 11% and domestic abuse rates have likewise fallen2.
        When corporal punishment is banned in both school and the home, parents and
        teachers are forced to devise alternative punishments that do not involve potentially
        abusive physical discipline. Such punishments, like detention and reduction
        of allowance money, can be just as, if not more, effective than corporal punishment
        while avoiding all of its potential side effects. Furthermore, when physical
        discipline is not considered a socially acceptable means of punishment, abuse
        rates tend to fall, as individuals become less prone to resorting to physical
        castigation. 1: Green, Frederick. 1988. "Corporal Punishment and Child Abuse".
        Project No Spank. 2 Durrant, Joan. 1996. "The Swedish Ban on Corporal Punishment:
        Its History and Effects". Project No Spank.'
