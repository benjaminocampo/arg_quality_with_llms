    dialectic:
      ex_A_argA: The cost of upkeeping AI of this nature wouldn't be different from
        upkeeping a server farm. The money could be easily acquired, for example from
        the salaries of parliament members. We have the technology to prevent any kinds
        of technical failures, such as power outages. These are just questions of engineering
        and can be solved easily. Also, a constant offline backup would secure the machine
        from possible corruptions. There doesn't need to be improvements added to the
        AI; unless it decides so by itself. Adding any improvements could compromise
        the integrity of the machine. In the same sense, it should not be allowed access
        into Internet. It could be allowed to view material, but it couldn't run any
        software nor upload anything to the net. This is to completely isolate the machine,
        so that it can aquire information by itself but only way it could affect anything
        at all would be by stating its demands to the people tending to it. It can't
        be hacked because of the isolation. Obvious attempts to hack it manually would
