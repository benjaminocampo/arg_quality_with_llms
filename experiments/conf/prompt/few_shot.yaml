    logic:
      ex_A_argA: 'Corporal punishment offers any easy way out for teachers. Rather than
        trying to engage with disruptive children in order to find out the cause of
        their misbehavior, they can send them on to be physically punished so that hopefully
        they will not speak up as much in class. This serves only to mask the underlying
        problem in many instances. Often the students who act out most in class suffer
        from domestic abuse, or are from unstable households 1. These students are the
        most vulnerable in the classroom, and corporal punishment does nothing to help
        them, but rather serves only to compound the problem further. Teachers will
        often take the easy solution, so that when given the option of passing troubled
        students on for more stringent discipline, they let down in the greatest need
        of help. This is played out in the United States, where in states that allow
        corporal punishment test scores tend to be lower. 36% of states that allow corporal
        punishment have a state composite score average above the national mean; compared
        to 89% of those where it is banned scoring above the mean.2 This has been attributed
        to lack of attempted engagement by teachers with students, who instead choose
        the violent, confrontational salve of corporal punishment over more constructive
        engagement. Clearly, corporal punishment does nothing but encourage teachers
        to take the path that is easy for them at the expense of their students'' wellbeing.
        1 Newsweek. "The Principal and the Paddle". 2 Stophitting, "Facts vs. Opinion:
        School Corporal Punishment". accessed 20/6/11'
      ex_A_argB: This article shows the ineffectiveness of corporal punishment in schools.
        In closing, corporal punishment should be banned because it is ineffective and
        lowers students' IQ's. Other forms of punishment should be explored and tested.
        Good luck.
      ex_B_argA: 'I appreciate the chance to argue this topic. For semantic clarity,
        the two possible debate-friendly meanings of this debate''s title read as follows:
        "Corporal punishment is being reintroduced to schools" - versus "no it isn''t."
        "Corporal punishment should be reintroduced to schools" - versus "no it shouldn''t."
        "Corporal punishment being reintroduced to schools" is like saying "Flowers
        being picked." One cannot agree or disagree, the sentence is worded as hypothetical.
        Based on my opposition''s first round arguments, until otherwise specified,
        I will assume he means to use the latter, *should be* phrasing. That said, although
        public schools do not typically practice corporal punishment, it was never legally
        un-introduced from schools. 1. Parents are entitled to corporal punishment "Corporal
        punishment of minors within domestic settings is still lawful in 49 of the United
        States. Delaware outlawed it as child abuse in 2012" 2. Teachers are entitled
        to the same teaching methods as parents according to "In loco parentis," a legal
        doctrine adopted by both the United States and Britain. "this doctrine can provide
        a non-biological parent to be given the legal rights and responsibilities of
        a biological parent if they have held themselves out as the parent" A doctrine
        that was never removed cannot technically be reintroduced. To ''reintroduce''
        corporal punishment, we would have to first ban it, then reintroduce it. I argue
        that we should not reintroduce it because that would require us to take the
        time to unnecessarily ban it.'
