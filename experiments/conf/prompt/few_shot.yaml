    rhetoric:
      ex_A_argA: "The government can stimulate change by using indirect taxes to increase\
        \ prices so that demand is limited. This is already being done for petrol, alcohol\
        \ and tobacco, but it could be used much wider if, at the same time, direct\
        \ taxes were cut. This is difficult at present when the government has lost\
        \ financial control and is therefore desperate to increase taxation in any form.\
        \ But fuel taxes could be further increased if the basic allowance of income\
        \ tax and certain social payments were increased at the same time. Then only\
        \ those who persisted in using fuel excessively would actually pay more. With\
        \ income tax gone employers can afford to expand thus creating more jobs. The\
        \ National Minimum wage as it stands is a joke. I was earning about the same\
        \ 25 years ago for unskilled labour. Instead of taking income tax and then crediting\
        \ it back to individuals, that must incur administration costs, let everyone\
        \ keep what they earn, except \xA320 a week National Insurance, a system that\
        \ can only work if the majority of the workforce are paying into it, which abolishing\
        \ income tax will attain. Income tax was originally collected to fund the Monarch's\
        \ of the day so they could go forth and conquer. Once the war was won the tax\
        \ was dissolved, that was until the Napoleonic wars when suddenly it became\
        \ part and parcel of everyday life and has been unquestioned ever since. Getting\
        \ rid of it gives more money to the pocket of the people who will then spend\
        \ more, keeping demand high prices low. There's no need to raise other taxes\
        \ because of this. The tax is unfair and not needed."
