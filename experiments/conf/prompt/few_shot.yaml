        \ catapult 6 million out of poverty. 5. Americans are overwhelmingly in support\
        \ of it. A poll reported that 80 percent of Americans support raising the minimum\
        \ wage to $10. (5) Sources 1. 2. 3. 4. 5. 6."
      ex_A_argB: 'Resolution: If the United States Government increased minimum wage,
        the total federal spending would decrease. Definitions: Increased: To make greater,
        as in number, size, strength, or quality; augment; add to Minimum wage: T he
        lowest wage payable to employees in general or to designated employees as fixed
        by law or by union agreement. Spending: To spend money Decrease: To make less;
        cause to diminish: Rules The first round is acceptance only No profanity No
        trolling'
      ex_B_argA: DeepBlue forfeited this round. Pro Sometimes the utility of a debate
        is that it helps to refine one's statement. When I say "The Federal Minimum
        wage should NOT be raised", I mean it should not be raised NOW. The debate question
        had its genesis in news articles from New York and elsewhere as a response to
        people protesting for an increase. Raising the wage now is the wrong response
        , to the wrong problem and at the wrong time. With the current level of unemployment,
        and those who are not in the labor market, the minimum should not be raised
        until those issues are resolved. To raise it NOW only compounds the overall
        problem with the economy. When the federal government begins to act responsibly,
        this issue could be revisited. California may be raising their in-state minimum
        to $10 per hour. Let's wait and see what their experience shows. In the meantime,
        I still stand that "The Federal Minimum wage should NOT be raised at this time."
